name: Build Android APK (Dayni)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Dayni APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Build web app bundle
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Apply Dayni launcher icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/pwa-192x192.png "$dir/ic_launcher.png"
              cp public/pwa-192x192.png "$dir/ic_launcher_round.png"
            fi
          done

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK release file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Dayni-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dayni-Android-APK
          path: Dayni-v1.0.${{ github.run_number }}.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "دَيني | Dayni v1.0.${{ github.run_number }}"
          body: |
            نسخة Android APK من تطبيق **دَيني | Dayni** لإدارة الديون الشخصية.
          files: Dayni-v1.0.${{ github.run_number }}.apk
